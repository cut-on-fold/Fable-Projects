<text x="14" y="30.425" font-size="5" font-weight="400" fill="#3b1f6e">7 × 5 dots, 8 mm, every 6 in from the top-left corner and then the far edge, with lines every 12 in. Project this through a calibration set on the four corners of the mat, draw along the lines, stick a dot in the middle of each target.</text>
<text x="14" y="39.85" font-size="5" font-weight="400" fill="#3b1f6e">Then check with a tape, measuring to the middle of the lines: 12 in between lines, 36 in across, 24 in down, and corner to corner 43.267 in (1098.972 mm). Any dot is also 6 in from its neighbours.</text>
