<text x="15" y="214.109" font-size="3.4" font-weight="400" fill="#3b1f6e">Measure the 4 in square and the 5 cm corner squares. All wrong by the same amount: the printer is</text>
<text x="15" y="219.039" font-size="3.4" font-weight="400" fill="#3b1f6e">scaling. Corners differ: the paper slipped.</text>
<text x="15" y="225.448" font-size="3.4" font-weight="400" fill="#3b1f6e">Lines 2 mm wide, like a Grain-Nest export; measure to the middle.</text>
