<line x1="184.15" y1="75.1" x2="184.15" y2="77.5" stroke="#e8731a" stroke-width="0.35"/>
<circle cx="31.75" cy="225.9" r="4" fill="none" stroke="#e8731a" stroke-width="0.5"/>
<line x1="27.75" y1="225.9" x2="30.15" y2="225.9" stroke="#e8731a" stroke-width="0.35"/>
<line x1="33.35" y1="225.9" x2="35.75" y2="225.9" stroke="#e8731a" stroke-width="0.35"/>
<line x1="31.75" y1="221.9" x2="31.75" y2="224.3" stroke="#e8731a" stroke-width="0.35"/>
<line x1="31.75" y1="227.5" x2="31.75" y2="229.9" stroke="#e8731a" stroke-width="0.35"/>
<circle cx="184.15" cy="225.9" r="4" fill="none" stroke="#e8731a" stroke-width="0.5"/>
<line x1="180.15" y1="225.9" x2="182.55" y2="225.9" stroke="#e8731a" stroke-width="0.35"/>
