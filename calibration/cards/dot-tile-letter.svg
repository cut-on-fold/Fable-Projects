<rect x="31.75" y="73.5" width="152.4" height="152.4" fill="none" stroke="#4f8a26" stroke-width="0.5" stroke-dasharray="4 3"/>
<circle cx="31.75" cy="73.5" r="4" fill="none" stroke="#e8731a" stroke-width="0.5"/>
<line x1="27.75" y1="73.5" x2="30.15" y2="73.5" stroke="#e8731a" stroke-width="0.35"/>
