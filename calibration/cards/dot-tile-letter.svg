<text x="107.95" y="149.7" text-anchor="middle" font-size="6" fill="#4f8a26">6 in between dot centres</text>
</g>
<g inkscape:groupmode="layer" inkscape:label="Calibration" id="calibration">
<rect id="calibration-square" inkscape:label="calibration-square" x="57.15" y="98.9" width="101.6" height="101.6" fill="none" stroke="#3b1f6e" stroke-width="0.5"/>
<text id="calibration-label" x="57.15" y="205.5" font-size="4" fill="#3b1f6e">4 in (101.6 mm) square: measure to check the print is at 100%</text>
</g>
<g inkscape:groupmode="layer" inkscape:label="Instructions" id="instructions">
<text x="12" y="16" font-size="4" font-weight="700" fill="#3b1f6e">Dot tile, Letter: a 6 in cell of dot targets to print at 100%, for marking or checking dots</text>
<text x="12" y="23.54" font-size="4" font-weight="400" fill="#3b1f6e">Print at 100% (no fit to page) and measure the 4 in square. Lay the page on the mat with two</text>
<text x="12" y="29.34" font-size="4" font-weight="400" fill="#3b1f6e">targets on two dots already in place, and mark the other two through the centres with a pin</text>
<text x="12" y="35.14" font-size="4" font-weight="400" fill="#3b1f6e">or a pencil; or lay it over four dots to check them. The targets are 8 mm, the size of a</text>
<text x="12" y="40.94" font-size="4" font-weight="400" fill="#3b1f6e">dot.</text>
</g>
<g inkscape:groupmode="layer" inkscape:label="Border" id="border">
<rect x="1" y="1" width="213.9" height="277.4" fill="none" stroke="#00ffff" stroke-width="2"/>
</g>
</svg>
