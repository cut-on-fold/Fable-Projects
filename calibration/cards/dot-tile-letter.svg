<line x1="180.15" y1="73.5" x2="182.55" y2="73.5" stroke="#e8731a" stroke-width="0.35"/>
<line x1="185.75" y1="73.5" x2="188.15" y2="73.5" stroke="#e8731a" stroke-width="0.35"/>
