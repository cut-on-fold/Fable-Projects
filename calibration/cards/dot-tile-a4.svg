     width="210mm" height="297mm" viewBox="0 0 210 297" font-family="sans-serif">
<title>Dot tile, A4</title>
<rect width="210" height="297" fill="#ffffff"/>
<g inkscape:groupmode="layer" inkscape:label="Tile" id="tile">
<rect x="28.8" y="82.3" width="152.4" height="152.4" fill="none" stroke="#4f8a26" stroke-width="0.5" stroke-dasharray="4 3"/>
<circle cx="28.8" cy="82.3" r="4" fill="none" stroke="#e8731a" stroke-width="0.5"/>
<line x1="24.8" y1="82.3" x2="27.2" y2="82.3" stroke="#e8731a" stroke-width="0.35"/>
<line x1="30.4" y1="82.3" x2="32.8" y2="82.3" stroke="#e8731a" stroke-width="0.35"/>
<line x1="28.8" y1="78.3" x2="28.8" y2="80.7" stroke="#e8731a" stroke-width="0.35"/>
<line x1="28.8" y1="83.9" x2="28.8" y2="86.3" stroke="#e8731a" stroke-width="0.35"/>
<circle cx="181.2" cy="82.3" r="4" fill="none" stroke="#e8731a" stroke-width="0.5"/>
<line x1="177.2" y1="82.3" x2="179.6" y2="82.3" stroke="#e8731a" stroke-width="0.35"/>
<line x1="182.8" y1="82.3" x2="185.2" y2="82.3" stroke="#e8731a" stroke-width="0.35"/>
<line x1="181.2" y1="78.3" x2="181.2" y2="80.7" stroke="#e8731a" stroke-width="0.35"/>
<line x1="181.2" y1="83.9" x2="181.2" y2="86.3" stroke="#e8731a" stroke-width="0.35"/>
<circle cx="28.8" cy="234.7" r="4" fill="none" stroke="#e8731a" stroke-width="0.5"/>
<line x1="24.8" y1="234.7" x2="27.2" y2="234.7" stroke="#e8731a" stroke-width="0.35"/>
<line x1="30.4" y1="234.7" x2="32.8" y2="234.7" stroke="#e8731a" stroke-width="0.35"/>
<line x1="28.8" y1="230.7" x2="28.8" y2="233.1" stroke="#e8731a" stroke-width="0.35"/>
<line x1="28.8" y1="236.3" x2="28.8" y2="238.7" stroke="#e8731a" stroke-width="0.35"/>
<circle cx="181.2" cy="234.7" r="4" fill="none" stroke="#e8731a" stroke-width="0.5"/>
<line x1="177.2" y1="234.7" x2="179.6" y2="234.7" stroke="#e8731a" stroke-width="0.35"/>
<line x1="182.8" y1="234.7" x2="185.2" y2="234.7" stroke="#e8731a" stroke-width="0.35"/>
<line x1="181.2" y1="230.7" x2="181.2" y2="233.1" stroke="#e8731a" stroke-width="0.35"/>
<line x1="181.2" y1="236.3" x2="181.2" y2="238.7" stroke="#e8731a" stroke-width="0.35"/>
<text x="105" y="158.5" text-anchor="middle" font-size="6" fill="#4f8a26">6 in between dot centres</text>
</g>
<g inkscape:groupmode="layer" inkscape:label="Calibration" id="calibration">
<rect id="calibration-square" inkscape:label="calibration-square" x="54.2" y="107.7" width="101.6" height="101.6" fill="none" stroke="#3b1f6e" stroke-width="0.5"/>
<text id="calibration-label" x="54.2" y="214.3" font-size="4" fill="#3b1f6e">4 in (101.6 mm) square: measure to check the print is at 100%</text>
</g>
<g inkscape:groupmode="layer" inkscape:label="Instructions" id="instructions">
<text x="12" y="16" font-size="4" font-weight="700" fill="#3b1f6e">Dot tile, A4: a 6 in cell of dot targets to print at 100%, for marking or checking dots</text>
<text x="12" y="23.54" font-size="4" font-weight="400" fill="#3b1f6e">Print at 100% (no fit to page) and measure the 4 in square. Lay the page on the mat with</text>
<text x="12" y="29.34" font-size="4" font-weight="400" fill="#3b1f6e">two targets on two dots already in place, and mark the other two through the centres with</text>
<text x="12" y="35.14" font-size="4" font-weight="400" fill="#3b1f6e">a pin or a pencil; or lay it over four dots to check them. The targets are 8 mm, the size</text>
<text x="12" y="40.94" font-size="4" font-weight="400" fill="#3b1f6e">of a dot.</text>
</g>
<g inkscape:groupmode="layer" inkscape:label="Border" id="border">
<rect x="1" y="1" width="208" height="295" fill="none" stroke="#00ffff" stroke-width="2"/>
</g>
</svg>
