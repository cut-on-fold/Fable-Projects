name: Thimble tests

on:
  push:
    paths: ['thimble/**', '.github/workflows/thimble-test.yml']
  pull_request:
    paths: ['thimble/**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: thimble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: thimble/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
