name: Publish to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['thimble/**', 'bolt-end/**', 'site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch Pages on for this repository if it is not already
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Thimble
        working-directory: thimble
        run: npm ci && npm test && npm run typecheck && npm run build
      - name: Bolt End
        working-directory: bolt-end
        run: npm ci && npm test && npm run typecheck && npm run build
      - name: Assemble the site
        run: |
          mkdir -p site-out/thimble site-out/bolt-end
          cp -r site/. site-out/
          cp -r thimble/dist/. site-out/thimble/
          cp -r bolt-end/dist/. site-out/bolt-end/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
