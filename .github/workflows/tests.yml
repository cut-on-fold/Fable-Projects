name: Tests

on:
  push:
    paths: ['thimble/**', 'bolt-end/**', 'lantern/**', 'calibration/**', '.github/workflows/tests.yml']
  pull_request:
    paths: ['thimble/**', 'bolt-end/**', 'lantern/**', 'calibration/**']

jobs:
  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [thimble, bolt-end, lantern]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Browser smoke test
        if: matrix.project == 'thimble' || matrix.project == 'lantern'
        run: npx playwright install --with-deps chromium && npm run smoke
      - uses: actions/upload-artifact@v5
        if: (matrix.project == 'thimble' || matrix.project == 'lantern') && always()
        with:
          name: ${{ matrix.project }}-smoke-shots
          path: ${{ matrix.project }}/smoke-shots
          if-no-files-found: ignore

  calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: The committed cards match the script
        run: |
          node calibration/make.mjs
          git diff --exit-code -- calibration/cards
