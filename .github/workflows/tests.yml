name: Tests

on:
  push:
    paths: ['thimble/**', 'bolt-end/**', 'calibration/**', '.github/workflows/tests.yml']
  pull_request:
    paths: ['thimble/**', 'bolt-end/**', 'calibration/**']

jobs:
  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [thimble, bolt-end]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The committed cards match the script
        run: |
          node calibration/make.mjs
          git diff --exit-code -- calibration/cards
